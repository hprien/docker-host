services:
  remote-code:
    build: .
    container_name: remote-code
    restart: unless-stopped
    volumes:
      - ./.ssh:/root/.ssh
    ports:
      - 41111:41111
    environment:
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD}
    networks:
      - remote-code-network
      - ollama-network

networks:
  remote-code-network:
    driver: bridge
    name: remote-code-network
  ollama-network:
    external: true